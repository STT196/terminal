version: '3.8'

services:
  terminal-ssh:
    image: terminal-ssh:latest
    container_name: terminal-ssh
    restart: unless-stopped
    environment:
      SSH_PORT: "2222"
      HTTP_PORT: "8000"
    ports:
      - "22:2222"
    volumes:
      - ./data:/data
    networks:
      - terminal-net

networks:
  terminal-net:
    driver: bridge
