version: '3.8'

services:
  terminal-ssh:
    image: terminal-ssh:latest
    container_name: terminal-ssh
    restart: unless-stopped
    environment:
      SSH_PORT: "2222"
      HTTP_PORT: "8000"
    ports:
      - "2222:2222"
      - "8000:8000"
    networks:
      - terminal-net

  nginx:
    image: nginx:stable-alpine
    container_name: terminal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - terminal-ssh
    networks:
      - terminal-net

networks:
  terminal-net:
    driver: bridge
